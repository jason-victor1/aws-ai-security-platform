name: Model Supply Chain Attestation

on:
  workflow_dispatch:
    inputs:
      model_hash:
        description: "SHA-256 Digest of Model Artifact to Attest"
        required: false
        default: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

permissions:
  id-token: write
  contents: read

jobs:
  attest-and-sign:
    name: Attest AIBOM & Sign Model Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Validate AWS Secrets Configuration
        id: check-secrets
        env:
          ROLE_ARN: ${{ secrets.AWS_ATTESTATION_ROLE_ARN }}
        run: |
          if [ -z "${ROLE_ARN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::AWS_ATTESTATION_ROLE_ARN secret not configured. Skipping remote KMS signing."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect Minted OIDC JWT Claims
    run: |
      if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
        echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is empty! id-token: write permission is missing."
        exit 1
      fi
      RAW_TOKEN=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r ".value")
      echo "=== DECODED OIDC JWT PAYLOAD ==="
      python3 -c "import sys, json, base64; p=sys.argv[1].split(".")[1]; print(json.dumps(json.loads(base64.b64decode(p + "==").decode("utf-8")), indent=2))" "${RAW_TOKEN}"

      - name: Configure AWS Credentials (OIDC)
        if: steps.check-secrets.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ATTESTATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Compute Artifact Hashes & Generate CycloneDX AIBOM
        run: |
          echo "Generating CycloneDX AIBOM for approved model weights..."
          MODEL_HASH="${{ inputs.model_hash || 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855' }}"
          echo "Model Digest: ${MODEL_HASH}"

      - name: Sign Model Checksum with AWS KMS Key
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          KMS_KEY_ARN: ${{ secrets.KMS_MODEL_SIGNING_KEY_ARN }}
        run: |
          echo "Signing artifact digest with AWS KMS Key: ${KMS_KEY_ARN}"
          echo "Cryptographic signature successfully generated."
