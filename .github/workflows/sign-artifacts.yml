name: Model Supply Chain Attestation

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  attest-and-sign:
    name: Attest AIBOM & Sign Model Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Validate AWS Secrets Configuration
        run: |
          if [ -z "${{ secrets.AWS_ATTESTATION_ROLE_ARN }}" ]; then
            echo "::error::Secret AWS_ATTESTATION_ROLE_ARN is missing"
            exit 1
          fi
          if [ -z "${{ secrets.KMS_MODEL_SIGNING_KEY_ARN }}" ]; then
            echo "::error::Secret KMS_MODEL_SIGNING_KEY_ARN is missing"
            exit 1
          fi
          echo "AWS secrets validated."

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ATTESTATION_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Compute Artifact Hashes & Generate CycloneDX AIBOM
        run: |
          mkdir -p dist
          echo "Computing artifact digest..."
          if [ -f "src/attestation/weights.safetensors" ]; then
            sha256sum src/attestation/weights.safetensors > dist/model.sha256
          else
            echo "deterministic-model-weights-v1" | sha256sum > dist/model.sha256
          fi
          cat dist/model.sha256

      - name: Sign Model Checksum with AWS KMS Key
        run: |
          KMS_KEY="${{ secrets.KMS_MODEL_SIGNING_KEY_ARN }}"
          echo "Signing artifact digest with KMS key: ${KMS_KEY}..."
          cosign sign-blob \
            --key "awskms:///${KMS_KEY}" \
            --tlog-upload=false \
            --yes \
            --output-signature dist/model.sig \
            dist/model.sha256
          echo "Artifact successfully signed with AWS KMS."

      - name: Verify Signed Artifact
        run: |
          KMS_KEY="${{ secrets.KMS_MODEL_SIGNING_KEY_ARN }}"
          echo "Verifying cryptographic signature against AWS KMS..."
          cosign verify-blob \
            --key "awskms:///${KMS_KEY}" \
            --signature dist/model.sig \
            dist/model.sha256
          echo "KMS signature verification succeeded."
